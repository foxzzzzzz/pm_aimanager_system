# V1.4 workbook layout; this is the structural version, not the document title version.
template_id: lyra_project_spec
template_version: "1.1"
# Projects first published using this predecessor retain their original node codes.
legacy_template_version: "1.0"
required_sheets:
  产品规格书: A1:I75
  项目团队构成: A1:F26
  项目进度表: A1:AC15
identity_markers:
  - sheet: 产品规格书
    cell: A1
    contains: 深圳市智林泰电子科技有限公司
  - sheet: 产品规格书
    cell: D4
    contains: 项目号：
required_markers:
  - sheet: 项目团队构成
    cell: A4
    equals: 团队成员
  - sheet: 项目团队构成
    cell: B4
    equals: 责任部门
  - sheet: 项目团队构成
    cell: C4
    equals: 负责人
  - sheet: 项目进度表
    cell: A2
    equals: 项目节点
product_specs:
  sheet: 产品规格书
  first_row: 6
  last_row: 75
  columns:
    major_category: A
    category: B
    item: C
    configuration: D
    core_information: E
    selected_model: F
    notes: G
    check_confirmation: H
    check_content: I
team:
  sheet: 项目团队构成
  first_row: 5
  last_row: 26
  project_manager_role: 项目经理
  columns:
    role: B
    name: C
    phone: D
    email: E
    notes: F
progress:
  sheet: 项目进度表
  milestone_header_row: 2
  first_milestone_column: 2
  plan_first_row: 3
  plan_last_row: 5
  actual_completion_row: 6
  variance_days_row: 7
  variance_note_row: 8
  risk_note_row: 9
  raci_rows:
    R: 11
    A: 12
    C: 13
    I: 14
  output_row: 15
# List order is the business/display order. code is used for projects first published
# with this layout. legacy_code is used only for projects first published with 1.0.
# Codes are project-scoped identities and must never be regenerated from dates.
