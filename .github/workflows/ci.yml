name: CI

on:
  push:
  pull_request:

jobs:
  phase0-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install API dependencies
        run: |
          python -m pip install -r apps/api/requirements.lock
          python -m pip install --no-deps -e apps/api
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Python lint
        run: python -m ruff check apps/api/src apps/api/tests
      - name: Python types
        run: python -m mypy apps/api/src
      - name: Python tests
        run: python -m pytest apps/api/tests
      - name: JavaScript tests
        run: pnpm test
      - name: TypeScript types
        run: pnpm typecheck
      - name: Admin build
        run: pnpm build
