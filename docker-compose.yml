services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_manager}
      POSTGRES_USER: ${POSTGRES_USER:-project_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-project-manager}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-now}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${MINIO_API_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-60}
    environment:
      APP_CONFIG_PATH: ${APP_CONFIG_PATH:-/app/config/app.example.yaml}
      PROJECT_MANAGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-project_manager}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-project_manager}
      PROJECT_MANAGER_REDIS_URL: redis://redis:6379/0
      PROJECT_MANAGER_STORAGE_BACKEND: s3
      PROJECT_MANAGER_S3_ENDPOINT: http://minio:9000
      PROJECT_MANAGER_S3_BUCKET: project-manager
      PROJECT_MANAGER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-project-manager}
      PROJECT_MANAGER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-now}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      PHONE_HMAC_KEY: ${PHONE_HMAC_KEY:-}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      PROJECT_MANAGER_ALLOW_DEV_WECHAT_LOGIN: ${PROJECT_MANAGER_ALLOW_DEV_WECHAT_LOGIN:-true}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-60}
    command: ["celery", "-A", "project_manager_api.tasks:celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_CONFIG_PATH: ${APP_CONFIG_PATH:-/app/config/app.example.yaml}
      PROJECT_MANAGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-project_manager}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-project_manager}
      PROJECT_MANAGER_REDIS_URL: redis://redis:6379/0
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      PHONE_HMAC_KEY: ${PHONE_HMAC_KEY:-}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      PROJECT_MANAGER_SMS_ENABLED: ${PROJECT_MANAGER_SMS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-60}
    command: ["celery", "-A", "project_manager_api.tasks:celery_app", "beat", "--loglevel=INFO"]
    environment:
      APP_CONFIG_PATH: ${APP_CONFIG_PATH:-/app/config/app.example.yaml}
      PROJECT_MANAGER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-project_manager}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-project_manager}
      PROJECT_MANAGER_REDIS_URL: redis://redis:6379/0
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "${ADMIN_WEB_HOST_PORT:-15173}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
