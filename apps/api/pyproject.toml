[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-manager-api"
version = "0.4.1"
description = "Backend API for the AI project management system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "boto3>=1.40,<2.0",
  "fastapi>=0.116,<1.0",
  "jsonschema>=4.25,<5.0",
  "openpyxl>=3.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.11,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "PyYAML>=6.0,<7.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3.0",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
  "types-openpyxl>=3.1,<4.0",
  "types-jsonschema>=4.25,<5.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
